<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejemplo · Nube de puntos 3D · Drone Mapping MX</title>

  <script>
  /* Registrar SW que sirve octree.bin (muestra-origen-veg) desde chunks <100MB (GitHub Pages).
     Necesario para que la NUBE cargue aunque se entre directo a este demo (sin pasar por la raíz).
     Reload-once para que el SW controle antes del primer fetch del octree. */
  (function () {
    if (!('serviceWorker' in navigator)) return;
    if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') return;
    navigator.serviceWorker.register('/sw-octree.js').then(function () {
      return navigator.serviceWorker.ready;
    }).then(function () {
      if (!navigator.serviceWorker.controller && !sessionStorage.getItem('swOctreeReloaded')) {
        sessionStorage.setItem('swOctreeReloaded', '1');
        location.reload();
      }
    }).catch(function (e) { console.warn('SW octree register failed', e); });
  })();
  </script>

  <!-- Potree CSS -->
  <link rel="stylesheet" type="text/css" href="/assets/_potree/build/potree/potree.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0F0F0F;
      overflow: hidden;
      /* En móvil: el gesto táctil debe ir a los controles de Potree (rotar/zoom/pan),
         NO al scroll de la página ni del deck que embebe este iframe. */
      touch-action: none;
      overscroll-behavior: none;
    }
    #potree_render_area {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      touch-action: none;
    }
    /* El canvas que crea Potree dentro del render area también cede el gesto */
    #potree_render_area canvas { touch-action: none; display: block; }
    /* Hide sidebar completely — clean iframe embed */
    #sidebar_root,
    #potree_sidebar_toggle,
    #potree_map_toggle,
    .potree_sidebar_brand { display: none !important; }

    /* Modo público para cotizaciones: conserva la demostración técnica y
       elimina cualquier puerta visual hacia ubicación o coordenadas. */
    body.sample-mode #measure-toolbar button[data-tool="point"],
    body.sample-mode #view-mode,
    body.sample-mode #map2d { display: none !important; }

    /* Minimal overlay label */
    #overlay-label {
      position: absolute;
      bottom: 10px; left: 12px;
      font-family: 'Space Grotesk', monospace, sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(123, 193, 66, 0.75);
      pointer-events: none;
      z-index: 10;
    }

    /* Loading indicator */
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0F0F0F;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      transition: opacity 0.6s ease;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    #loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(123,193,66,0.15);
      border-top-color: rgba(123,193,66,0.8);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text {
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* Mini-toolbar de medición · botones flotantes */
    #measure-toolbar {
      position: absolute;
      top: 12px; left: 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      z-index: 30;
      max-width: calc(100% - 24px);
    }
    #measure-toolbar button {
      font-family: 'Space Grotesk', monospace, sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      background: rgba(15,15,15,0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(123,193,66,0.35);
      border-radius: 999px;
      padding: 6px 11px;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
    }
    #measure-toolbar button:hover {
      background: rgba(123,193,66,0.18);
      border-color: rgba(123,193,66,0.7);
    }
    #measure-toolbar button.active {
      background: rgba(123,193,66,0.32);
      border-color: rgba(123,193,66,0.85);
      color: #fff;
    }
    #measure-toolbar button.clear {
      border-color: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.55);
    }
    #measure-toolbar button.clear:hover {
      background: rgba(255,80,80,0.15);
      border-color: rgba(255,120,120,0.5);
      color: #fff;
    }
    #measure-toolbar button { white-space: nowrap; }
    #measure-toolbar .ti { margin-right: 5px; }       /* glifo */
    #measure-toolbar .tl { /* etiqueta · se oculta en móvil */ }

    /* Selector de color (clasificación / elevación) */
    #color-toggle {
      position: absolute;
      top: 12px; right: 12px;
      display: flex;
      gap: 4px;
      z-index: 30;
      background: rgba(15,15,15,0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 3px;
    }
    #color-toggle button {
      font-family: 'Space Grotesk', monospace, sans-serif;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      background: transparent;
      border: 0;
      border-radius: 999px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    #color-toggle button.active {
      background: rgba(123,193,66,0.35);
      color: #fff;
    }

    /* Control de densidad de puntos · point budget */
    #density-control {
      position: absolute;
      top: 56px; right: 12px;
      z-index: 30;
      background: rgba(15,15,15,0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 230px;
    }
    #density-control label {
      font-family: 'Space Grotesk', monospace, sans-serif;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    #density-control .row { display: flex; align-items: center; gap: 8px; }
    #density-control input[type=range] {
      flex: 1;
      accent-color: #7BC142;
      height: 4px;
      cursor: pointer;
    }
    #density-control .value {
      font-family: 'Space Grotesk', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.88);
      min-width: 56px;
      text-align: right;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Capas / filtro de clasificación */
    #layers { position: absolute; top: 118px; right: 12px; z-index: 31; }
    #layers-btn {
      font-family: 'Space Grotesk', monospace, sans-serif; font-size: 11px;
      letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.85);
      background: rgba(15,15,15,0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(123,193,66,0.35); border-radius: 999px; padding: 6px 12px;
      cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; margin-left: auto;
    }
    #layers-btn .ti { font-size: 13px; }
    #layers-btn.open { background: rgba(123,193,66,0.28); border-color: rgba(123,193,66,0.7); color: #fff; }
    #layers-panel {
      position: absolute; top: 40px; right: 0; width: 250px; max-width: calc(100vw - 24px);
      background: rgba(15,15,15,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; gap: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #layers-panel[hidden] { display: none; }
    #layers .lp-sec { display: flex; flex-direction: column; gap: 8px; }
    #layers .lp-lbl {
      font-family: 'Space Grotesk', monospace; font-size: 9.5px; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
    }
    #layers .lp-chips, #layers .lp-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    #layers .lp-chip, #layers .lp-act {
      font-family: 'Space Grotesk', monospace, sans-serif; font-size: 11px; letter-spacing: 0.03em;
      color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.06);
      border: 1px solid rgba(123,193,66,0.30); border-radius: 999px; padding: 6px 11px;
      cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, opacity .15s;
    }
    #layers .lp-chip[data-grp].on { border-color: rgba(123,193,66,0.6); color: #fff; background: rgba(123,193,66,0.14); }
    #layers .lp-chip[data-grp]:not(.on) { opacity: 0.5; text-decoration: line-through; }
    #layers .lp-chip[data-layer] { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); }
    #layers .lp-chip[data-layer].active { border-color: rgba(123,193,66,0.7); color: #fff; background: rgba(123,193,66,0.2); }
    #layers .lp-act { border-color: rgba(123,193,66,0.5); color: #cde8a8; }
    #layers .lp-act.ghost { border-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.6); }

    /* Selector de vista: Puntos / Realista / Mapa */
    #view-mode {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 45;
      display: flex; gap: 4px; background: rgba(15,15,15,0.82);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 4px;
    }
    #view-mode button {
      font-family: 'Space Grotesk', monospace, sans-serif; font-size: 11px; letter-spacing: 0.07em;
      text-transform: uppercase; color: rgba(255,255,255,0.6); background: transparent; border: 0;
      border-radius: 999px; padding: 7px 17px; cursor: pointer; transition: background .18s, color .18s;
    }
    #view-mode button.active { background: rgba(123,193,66,0.38); color: #fff; }
    /* Vistas alternas (mesh / mapa) ocupan toda la pantalla; el selector queda encima */
    #realista, #map2d { position: absolute; inset: 0; z-index: 38; background: #0F0F0F; }
    #realista[hidden], #map2d[hidden] { display: none; }
    #realista model-viewer { width: 100%; height: 100%; background-color: #0F0F0F; }
    /* En vista alterna se ocultan los controles de Potree (el selector NO) */
    body.alt-view #potree_render_area,
    body.alt-view #measure-toolbar, body.alt-view #color-toggle, body.alt-view #density-control,
    body.alt-view #layers, body.alt-view #elevation-legend, body.alt-view #class-legend, body.alt-view #measure-stack,
    body.alt-view #loading-overlay { display: none !important; }
    /* el overlay-label se mantiene como marca; en móvil el selector sube si choca */
    @media (max-width: 600px) {
      #view-mode { bottom: 10px; }
    }

    /* ── Vista Mapa · cromo GIS (leyenda · etiquetas de cota · deslinde) ── */
    .contour-label {
      color: #A7E84F; font: 600 10px/1 'Space Grotesk', monospace, sans-serif;
      text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
      background: none; border: 0; white-space: nowrap; pointer-events: none;
    }
    .predio-label {
      color: #FF3B30; font: 700 11px/1 'Space Grotesk', sans-serif;
      background: rgba(255,255,255,0.95); padding: 3px 9px; border-radius: 7px;
      border: 1.5px solid #FF3B30;
      white-space: nowrap; box-shadow: 0 1px 5px rgba(0,0,0,0.45); pointer-events: none;
    }
    .map-legend {
      background: rgba(15,15,15,0.86); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      color: #e8e8e8; font: 11px/1.45 'Space Grotesk', sans-serif; padding: 11px 13px;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 11px; max-width: 236px;
    }
    .map-legend h4 {
      margin: 0 0 7px; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: #A7E84F;
    }
    .map-legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .map-legend .sw { width: 16px; flex: 0 0 auto; }
    .map-legend .sw.line { height: 0; border-top: 3px solid; }
    .map-legend .sw.box { height: 12px; border-radius: 2px; }
    .map-legend .ficha {
      margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.12);
      color: #b3b3b3; font-size: 10px; line-height: 1.55;
    }
    .map-legend .ficha b { color: #cfcfcf; font-weight: 600; }
    .leaflet-control-layers, .map-legend { box-shadow: 0 4px 18px rgba(0,0,0,0.4); }
    .leaflet-control-layers-expanded { font: 12px 'Space Grotesk', sans-serif; padding: 8px 10px 8px 8px; }
    .leaflet-bar a { color: #222; }
    @media (max-width: 600px) {
      .map-legend { max-width: 200px; font-size: 10px; padding: 9px 10px; }
      .leaflet-control-layers-expanded { font-size: 11px; }
    }

    /* Leyenda de elevación · horizontal · solo visible en modo 'elevation' */
    #elevation-legend {
      position: absolute;
      bottom: 12px; right: 12px;
      z-index: 30;
      display: none;
      flex-direction: column;
      gap: 7px;
      background: rgba(15,15,15,0.40);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 9px 12px 11px;
      width: 280px;
      font-family: 'Space Grotesk', monospace;
    }
    #elevation-legend.visible { display: flex; }
    #elevation-legend .title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }
    #elevation-legend .title .unit {
      color: rgba(123,193,66,0.82);
      letter-spacing: 0.06em;
      text-transform: none;
      font-size: 10px;
    }
    #elevation-legend .bar-wrap {
      position: relative;
      height: 14px;
      border-radius: 3px;
      /* Rampa SPECTRAL · ColorBrewer Spectral-9 (idéntica al default de Potree) */
      background: linear-gradient(to right,
        #5e4fa2 0%,
        #3288bd 12.5%,
        #66c2a5 25%,
        #abdda4 37.5%,
        #e6f598 50%,
        #fee08b 62.5%,
        #fdae61 75%,
        #f46d43 87.5%,
        #d53e4f 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
    }
    #elevation-legend .bar-wrap .tick {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 1px;
      background: rgba(255,255,255,0.55);
    }
    #elevation-legend .labels {
      position: relative;
      height: 14px;
      font-size: 9.5px;
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.02em;
    }
    #elevation-legend .labels span {
      position: absolute;
      transform: translateX(-50%);
      white-space: nowrap;
      line-height: 14px;
    }
    #elevation-legend .labels span.edge-left  { transform: translateX(0); }
    #elevation-legend .labels span.edge-right { transform: translateX(-100%); }
    #elevation-legend .labels b { color: rgba(255,255,255,0.96); font-weight: 600; }

    /* Leyenda de clasificación · vertical · solo visible en modo 'classification' */
    #class-legend {
      position: absolute;
      bottom: 12px; right: 12px;
      z-index: 30;
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(15,15,15,0.40);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 9px 12px 11px;
      width: 168px;
      font-family: 'Space Grotesk', monospace;
    }
    #class-legend.visible { display: flex; }
    #class-legend .title {
      font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }
    #class-legend .cl-items { display: flex; flex-direction: column; gap: 6px; }
    #class-legend .cl-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: rgba(255,255,255,0.88); line-height: 1;
    }
    #class-legend .cl-sw {
      width: 13px; height: 13px; border-radius: 3px; flex: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    /* Stack de cards de medición · bottom-left · una card por medición (apiladas) */
    #measure-stack {
      position: absolute;
      bottom: 12px; left: 12px;
      z-index: 31;
      display: flex;
      flex-direction: column;       /* primera arriba · última (más nueva) abajo, junto al ancla */
      gap: 8px;
      max-height: calc(100% - 76px);
      overflow-y: auto;
      padding-right: 2px;
    }
    #measure-stack::-webkit-scrollbar { width: 5px; }
    #measure-stack::-webkit-scrollbar-thumb { background: rgba(123,193,66,0.30); border-radius: 3px; }
    .mi-card {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 256px;
      background: rgba(15,15,15,0.40);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(123,193,66,0.30);
      border-radius: 10px;
      padding: 11px 13px 12px;
      font-family: 'Space Grotesk', monospace;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      animation: mi-in 0.18s ease;
    }
    @keyframes mi-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .mi-card .mi-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .mi-card .mi-type {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(123,193,66,0.92);
    }
    .mi-card .mi-type .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #7BC142;
      box-shadow: 0 0 8px rgba(123,193,66,0.8);
      flex-shrink: 0;
    }
    .mi-card .mi-close {
      background: transparent;
      border: 0;
      color: rgba(255,255,255,0.5);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
    }
    .mi-card .mi-close:hover { color: #fff; background: rgba(255,255,255,0.1); }
    /* Métrica primaria destacada */
    .mi-card .mi-primary {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .mi-card .mi-primary .val {
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.01em;
      line-height: 1;
    }
    .mi-card .mi-primary .unit {
      font-size: 12px;
      color: rgba(123,193,66,0.85);
      letter-spacing: 0.04em;
    }
    /* Filas label / valor */
    .mi-card .mi-rows { display: flex; flex-direction: column; gap: 3px; }
    .mi-card .mi-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
    }
    .mi-card .mi-row .k {
      color: rgba(255,255,255,0.52);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .mi-card .mi-row .v {
      color: rgba(255,255,255,0.92);
      text-align: right;
      letter-spacing: 0.02em;
    }
    .mi-card .mi-row .v b { color: #fff; font-weight: 600; }
    /* Lista de tramos · scrollable compacta */
    .mi-card .mi-segs {
      margin-top: 1px;
      max-height: 96px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .mi-card .mi-segs .seg {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 10px;
      color: rgba(255,255,255,0.62);
    }
    .mi-card .mi-segs .seg .v { color: rgba(255,255,255,0.85); }
    .mi-card .mi-segs::-webkit-scrollbar { width: 5px; }
    .mi-card .mi-segs::-webkit-scrollbar-thumb {
      background: rgba(123,193,66,0.35); border-radius: 3px;
    }
    /* Ocultar el branding label mientras hay cards visibles (evita solape bottom-left) */
    body.measure-open #overlay-label { opacity: 0; transition: opacity 0.2s; }

    /* Modo controles externos (deck móvil): el padre renderiza los controles ARRIBA
       del iframe → ocultamos los overlays in-viewer para no duplicar ni tapar el 3D. */
    body.ctrl-external #measure-toolbar,
    body.ctrl-external #color-toggle,
    body.ctrl-external #density-control,
    body.ctrl-external #elevation-legend,
    body.ctrl-external #class-legend { display: none !important; }

    /* ──────────────────────────────────────────────────────────────────
       Móvil (≤600px) · reacomodo de overlays para que NO se enciman.
       Cluster superior compacto: toolbar (solo íconos · 1 fila) arriba-izq +
       densidad arriba-der · selector de color en 2ª fila. Cluster inferior:
       leyenda full-width abajo · cards de medición elevadas sobre la leyenda
       cuando el modo elevación está activo.
       ────────────────────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      /* Toolbar de medición · solo íconos · una sola fila · arriba-izquierda */
      #measure-toolbar {
        top: 10px; left: 10px; right: auto;
        flex-wrap: nowrap;
        gap: 5px;
        max-width: calc(100% - 190px);   /* deja sitio a la densidad a la derecha */
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      #measure-toolbar::-webkit-scrollbar { display: none; }
      #measure-toolbar button { padding: 7px 10px; }
      #measure-toolbar .ti { margin-right: 0; font-size: 13px; }
      #measure-toolbar .tl { display: none; }          /* icon-only en móvil */

      /* Densidad · arriba-derecha · compacta */
      #density-control {
        top: 10px; right: 10px; left: auto;
        width: 165px;
        padding: 7px 10px;
      }

      /* Selector de color · 2ª fila · arriba-izquierda (no comparte fila con la toolbar) */
      #color-toggle { top: 64px; right: auto; left: 10px; }

      /* Leyenda de elevación · barra full-width abajo */
      #elevation-legend {
        left: 10px; right: 10px; bottom: 10px;
        width: auto;
        padding: 7px 12px 9px;
      }
      #elevation-legend .labels span:not(.edge-left):not(.edge-right):not(.mid) { display: none; }

      /* Cards de medición · abajo-izq · se elevan sobre la leyenda en modo elevación */
      #measure-stack {
        left: 10px; right: auto; bottom: 12px;
        max-height: calc(100% - 150px);
      }
      body.elevation-on #measure-stack { bottom: 94px; }  /* sobre la leyenda full-width (≈72px alto) */
      .mi-card { width: min(220px, calc(100vw - 20px)); }
    }
  </style>
</head>
<body>

  <!-- Capas / filtro de clasificación · panel colapsable -->

    <div id="layers-panel" hidden>

  </div>

  <!-- Leyenda de elevación · solo visible cuando el coloreado activo es 'elevation' -->
  <div id="elevation-legend" aria-hidden="true">
    <div class="title">
      <span>Elevación</span>
      <span class="unit">m s.n.m.</span>
    </div>
    <div class="bar-wrap" role="img" aria-label="Rampa de elevación SPECTRAL">
      <span class="tick" style="left:0%"></span>
      <span class="tick" style="left:25%"></span>
      <span class="tick" style="left:50%"></span>

    </div>
    <div class="labels">
      <span class="edge-left" id="ele-t0" style="left:0%">— m</span>
      <span id="ele-t1" style="left:25%">—</span>
      <span class="mid" id="ele-t2" style="left:50%"><b>—</b></span>
      <span id="ele-t3" style="left:75%">—</span>
      <span class="edge-right" id="ele-t4" style="left:100%">— m</span>
    </div>
  </div>

  <!-- Leyenda de clasificación · solo visible cuando el coloreado activo es 'classification' -->
  <div id="class-legend" aria-hidden="true">
    <div class="title"><span>Clasificación</span></div>
    <div class="cl-items">
      <div class="cl-row"><span class="cl-sw" style="background:#a87b4f"></span>Suelo</div>
      <div class="cl-row"><span class="cl-sw" style="background:#e6732e"></span>Edificación</div>
      <div class="cl-row"><span class="cl-sw" style="background:#216b30"></span>Vegetación alta</div>
      <div class="cl-row"><span class="cl-sw" style="background:#66b542"></span>Vegetación media</div>
      <div class="cl-row"><span class="cl-sw" style="background:#bde36b"></span>Vegetación baja</div>
    </div>
  </div>

  <!-- Stack de cards de medición · bottom-left · una card por medición (se crean en JS) -->
  <div id="measure-stack" aria-live="polite"></div>

  <!-- Overlay branding -->
  <div id="overlay-label">Muestra técnica anonimizada · 28 M puntos · Drone Mapping</div>

  <!-- ── Dependencies (order matters for Potree 1.8) ── -->

  <!-- BinaryHeap — required internally by Potree's priority queue -->
  <script src="/assets/_potree/libs/other/BinaryHeap.js"></script>

  <!-- jQuery -->
  <script src="/assets/_potree/libs/jquery/jquery-3.1.1.min.js"></script>

  <!-- Proj4 (coordinate transforms) -->
  <script src="/assets/_potree/libs/proj4/proj4.js"></script>

  <!-- Tween (camera animations) -->
  <script src="/assets/_potree/libs/tween/tween.min.js"></script>

  <!-- LAS/LAZ decoder (define LASFile · requerido por nubes con nodos .laz, formato 1.7) -->
  <script src="/assets/_potree/libs/plasio/js/laslaz.js"></script>

  <!-- ── Potree 1.8 core ── -->
  <script src="/assets/_potree/build/potree/potree.js"></script>

  <script>
    window.addEventListener('load', function () {

      const searchParams = new URLSearchParams(location.search);
      const sampleMode = true;
      const postSampleState = (action, detail = {}) => {
        if (sampleMode && window.parent !== window) {
          window.parent.postMessage({ source: 'dm-potree-sample', action, ...detail }, '*');
        }
      };
      let sampleReady = false;
      const markSampleReady = () => {
        if (sampleReady) return;
        sampleReady = true;
        postSampleState('ready', { points: 28017659 });
      };
      if (sampleMode) {
        document.body.classList.add('sample-mode');
        document.title = 'Muestra técnica 3D · Drone Mapping MX';
        document.getElementById('overlay-label').textContent =
          'Muestra real anonimizada · 28 M puntos · nube clasificada · Drone Mapping';
        document.querySelector('#elevation-legend .unit').textContent = 'm relativos';
        postSampleState('boot');
        setTimeout(() => { if (!sampleReady) postSampleState('slow'); }, 9000);
      }

      // ── Viewer init ──────────────────────────────────────────────────────
      const viewer = new Potree.Viewer(
        document.getElementById('potree_render_area')
      );

      viewer.setEDLEnabled(true);
      viewer.setEDLRadius(1.4);
      // EDL (eye-dome lighting) sombrea por diferencias de profundidad → oscurece
      // la nube en ciertas perspectivas. Bajamos la intensidad para que se vea más
      // brillosa/uniforme (antes 0.9 · muy marcado).
      viewer.setEDLStrength(0.4);
      viewer.setFOV(60);
      viewer.setPointBudget(4000000);
      viewer.setBackground('black');

      // Controles:
      // · Escritorio (mouse) → earthControls = navegación tipo Google Earth.
      // · Táctil (móvil/tablet) → earthControls queda como base INACTIVA (su
      //   update() es no-op en reposo y su drag aborta sin pivot), y un
      //   controlador táctil PROPIO estilo mapa maneja el gesto: 1 dedo = mover
      //   sobre el terreno · 2 dedos = pellizcar (zoom) + girar (yaw) + tilt
      //   (pitch). Antes earthControls no respondía al tacto de 1 dedo (drag
      //   aborta en `if(!this.pivot)return`, y el pivot solo lo setea `mousedown`
      //   que el touch nunca dispara).
      var isTouch = window.matchMedia('(pointer: coarse)').matches;
      var measuringActive = false;   // suspende la nav táctil mientras se mide
      // ?controls=external → el padre (deck) renderiza los controles ARRIBA del
      // iframe y los maneja por postMessage (en móvil, para no tapar el 3D).
      var externalControls = searchParams.get('controls') === 'external';
      if (externalControls) document.body.classList.add('ctrl-external');

      viewer.setControls(viewer.earthControls);
      window._potreeViewer = viewer;

      // ── Acercarse MUCHO más: bajar el near plane ─────────────────────────
      // Potree fija el near del camera = lowestSpacing*10 (ver Viewer.update). Eso
      // deja el near MAYOR que el radius al hacer zoom → recorta la superficie que
      // miras → tope duro de zoom + la nube "desaparece" al acercarse (se siente
      // como que la navegación se limita). Lo bajamos 10× con un setter en
      // cameraP.near (no tocamos la librería). Potree reescribe near cada frame con
      // su valor fresco, así que no se acumula. Beneficia móvil y escritorio.
      (function patchNearPlane(camP) {
        var _n = camP.near;
        Object.defineProperty(camP, 'near', {
          configurable: true,
          get: function () { return _n; },
          // QUIRÚRGICO: dejar el near de Potree TAL CUAL (no escalar) salvo cuando
          // recortaría la superficie al acercarse. Solo lo bajamos si supera el 60%
          // del radius (zoom muy cercano). Así el render/tamaño-de-punto/EDL en zoom
          // normal queda idéntico al stock (no degrada la navegación general) y solo
          // se interviene en zoom muy cercano para que no recorte.
          set: function (v) {
            var r = (viewer.scene && viewer.scene.view && viewer.scene.view.radius) || v;
            _n = Math.max(0.02, Math.min(v, r * 0.6));
          }
        });
      })(viewer.scene.cameraP);

      if (isTouch) setupMapTouchNav(viewer, function () { return measuringActive; });

      // ── Load cloud ───────────────────────────────────────────────────────
      Potree.loadPointCloud(
        '/assets/_potree/clouds/agua-blanca-veg/sample-metadata.json',
        'muestra-tecnica',
        function (e) {
          const pointcloud = e.pointcloud;
          const material   = pointcloud.material;

          material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
          material.shape         = Potree.PointShape.CIRCLE;
          material.size          = 2.0;

          // RGB por default (validado · la nube tiene color real)
          material.activeAttributeName = 'rgba';

          // Brillo del coloreado RGB (Diego: la nube se veía algo oscura · 2026-05-28).
          // rgbGamma <1 levanta midtones (natural) · rgbBrightness suma un lift leve.
          material.rgbGamma      = 0.80;
          material.rgbBrightness = 0.12;

          viewer.scene.addPointCloud(pointcloud);

          // ── Paleta de clasificación (re-clasificada con PDAL · SMRF+altura) ──
          // Clases ASPRS presentes: 2 Suelo · 3/4/5 Veg baja/media/alta · 6 Edificación · 9 Agua.
          const CLASS_COLORS = {
            2: [0.66, 0.48, 0.31, 1.0],   // Suelo · tierra cálida
            3: [0.74, 0.89, 0.42, 1.0],   // Veg baja · lima claro
            4: [0.40, 0.71, 0.26, 1.0],   // Veg media · verde
            5: [0.13, 0.42, 0.19, 1.0],   // Veg alta · verde bosque
            6: [0.90, 0.45, 0.18, 1.0]    // Edificación · naranja teja
          };
          try {
            for (const code in CLASS_COLORS) {
              if (!viewer.classifications[code]) viewer.classifications[code] = { visible: true, name: 'class ' + code };
              viewer.classifications[code].color = CLASS_COLORS[code];
              viewer.classifications[code].visible = true;
            }
            viewer.setClassifications(viewer.classifications);
          } catch (err) { console.warn('No pude fijar paleta de clases:', err); }

          // ── Diagnóstico: atributos disponibles en la nube ────────────────
          try {
            const attrs = (pointcloud.pcoGeometry && pointcloud.pcoGeometry.pointAttributes
              && pointcloud.pcoGeometry.pointAttributes.attributes) || [];
            console.log('Potree · atributos de la nube:', attrs.map(a => a.name));
            console.log('Potree · activeAttributeName actual:', material.activeAttributeName);
          } catch (err) { console.warn('No pude listar atributos:', err); }

          // ── Cámara: oblicua picada ~50° · EarthControls-compatible ─────
          // EarthControls update() lees view.position directamente (NO usa
          // yaw/pitch/radius para derivar posición — solo los usa para orientación).
          // Para fijar framing: (1) computar posición de cámara en mundo real,
          // (2) llamar view.position.set() + view.lookAt(target).
          // view.lookAt() calcula yaw/pitch/radius desde la dirección pos→target.
          //
          // El BB usa matrixWorld — puede ser identity al momento del callback.
          // Solución: usar las coordenadas hardcodeadas del metadata + retry loop
          // con rAF hasta que la posición se estabilice (no siga en 0,0,0).
          //
          // cloud.js bbox: X [0.00..206.92], Y [0.00..206.92], Z tight [0.00..44.93]
          // groundZ ≈ 0 + (45-0)*0.30 ≈ 13.5 · footprint ~207 m (mucho menor que parcelas ~791 m)
          try {
            // Usar BB world si ya está disponible; fallback a metadata hardcoded
            const bb = pointcloud.boundingBox.clone().applyMatrix4(pointcloud.matrixWorld);
            let cx, cy, groundZ;
            if (bb.min.x !== 0 || bb.max.x !== 0) {
              cx      = (bb.min.x + bb.max.x) / 2;
              cy      = (bb.min.y + bb.max.y) / 2;
              const zRange = bb.max.z - bb.min.z;
              groundZ = bb.min.z + zRange * 0.30;
            } else {
              cx = 103.46;
              cy = 103.46;
              groundZ = 13.48;
            }

            // Camera position: due south of center, looking north → cloud centered L/R
            // iter-12: back to iter-10 geometry (pitch=-45°) but horizDist=220 so
            //          cloud fits fully in frame with small margin top+bottom
            const azimuth   = Math.PI * 1.0;   // camera due south, looks north
            const horizDist = 65;   // escalado a la nube ~207 m (parcelas usaba 220 para ~791 m)
            const camAlt    = 65;
            const camX = cx + horizDist * Math.cos(azimuth);  // cx - 220
            const camY = cy + horizDist * Math.sin(azimuth);  // cy
            const camZ = groundZ + camAlt;

            // THREE is NOT a global — bundled inside Potree IIFE.
            // view.lookAt(x,y,z) 3-arg form works without THREE.Vector3.

            function applyCamera() {
              const view = viewer.scene.view;
              view.position.set(camX, camY, camZ);
              view.lookAt(cx, cy, groundZ);   // cloud center at ground level
              console.log('Camera applied · pos=(' + camX.toFixed(0) + ',' + camY.toFixed(0) + ',' + camZ.toFixed(0) + ') pitch=' + (view.pitch*180/Math.PI).toFixed(1) + '° radius=' + view.radius.toFixed(1));
            }

            // Apply immediately, then re-apply after render loop starts
            applyCamera();
            setTimeout(applyCamera, 50);
            setTimeout(applyCamera, 300);
          } catch (err) {
            console.warn('No pude orientar cámara:', err);
            viewer.fitToScreen(0.4);
          }

          // ── Esconder loading overlay ─────────────────────────────────────
          // Ocultar en cuanto la nube empieza a renderizar (primer nodo) o tras un
          // timeout CORTO. Antes (escritorio) se esperaba al "plateau" o 40 s → si
          // la nube tardaba o fallaba, el cliente veía PANTALLA NEGRA larga con el
          // spinner encima (bug reportado por Diego). Mostrar la nube en cuanto
          // llega es mejor que un overlay negro prolongado.
          var overlay  = document.getElementById('loading-overlay');
          var loadText = document.getElementById('loading-text');
          if (isTouch) {
            if (overlay) overlay.classList.add('hidden');
            markSampleReady();
          } else (function hideWhenLoading() {
            var t0 = Date.now();
            function pts() {
              var pc = viewer.scene.pointclouds[0]; if (!pc) return 0;
              var s = 0, vn = pc.visibleNodes || [];
              for (var i = 0; i < vn.length; i++) { var n = vn[i]; s += (n.getNumPoints ? n.getNumPoints() : (n.numPoints || 0)); }
              return s;
            }
            (function tick() {
              if (pts() > 0 || Date.now() - t0 > 8000) { if (overlay) overlay.classList.add('hidden'); markSampleReady(); }
              else setTimeout(tick, 350);
            })();
          })();

          // ── Wire toolbar de medición (Potree.measuringTool) ──────────────
          const measuringTool = viewer.measuringTool;
          const toolBtns = document.querySelectorAll('#measure-toolbar button[data-tool]');
          const presets = {
            distance: { showDistances:true,  closed:false, name:'Distancia' },
            area:     { showDistances:true,  showArea:true, closed:true, name:'Área' },
            height:   { showDistances:false, showHeight:true, closed:false, maxMarkers:2, name:'Altura' },
            point:    { showCoordinates:true, showAngles:false, showArea:false, closed:false, maxMarkers:1, name:'Punto' }
          };

          // ══ Cards info contextuales de medición (Opción B · multi-card) ═══
          // Una card por medición, apiladas bottom-left. Persisten hasta ✕/Limpiar
          // (permite comparar varias a la vez · ej. distancia + altura). Datos por
          // tipo desde measure.points[].position (UTM/m · matrixWorld identidad).
          //
          // MODO EXTERNO (`?cards=external`): en vez de dibujar las cards DENTRO del
          // visor, emite los datos por postMessage al padre (el deck las pinta junto
          // al iframe para no meter ruido visual sobre el 3D). DEFAULT = in-viewer
          // (lo que querrá cualquier visor/modelo futuro embebido o standalone).
          const externalCards = new URLSearchParams(location.search).get('cards') === 'external';
          const stack = document.getElementById('measure-stack');
          const cards = new Map();      // measure -> { id, el? }
          const idToMeasure = new Map();
          let cardIdSeq = 0;

          // Formato numérico es-MX (1,234.56)
          const nf = (n, dec) => Number(n).toLocaleString('es-MX',
            { minimumFractionDigits: dec, maximumFractionDigits: dec });
          const d2 = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);            // dist planimétrica 2D
          const d3 = (a, b) => Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z); // dist 3D

          function measureType(m) {
            if (m.showArea) return 'area';
            if (m.showHeight) return 'height';
            if (m.showCoordinates && m.maxMarkers === 1) return 'point';
            return 'distance';
          }

          // Calcula los datos de la card (agnóstico al render · sirve in-viewer y postMessage)
          function computeData(m) {
            const pts  = m.points.map(p => p.position);
            const type = measureType(m);
            if (type === 'point') {
              const p = pts[0];
              if (sampleMode) {
                return { type: 'Punto de muestra', val: nf(p.z, 1), unit: 'm relativos', rows: [
                  ['Privacidad', 'Coordenadas ocultas'],
                  ['Sistema', 'Referencia local anonimizada']
                ], segs: null };
              }
              return { type: 'Punto', val: nf(p.z, 1), unit: 'm s.n.m.', rows: [
                ['Eje X', '<b>' + nf(p.x, 2) + '</b> m'],
                ['Eje Y', '<b>' + nf(p.y, 2) + '</b> m'],
                ['Zona',  'Referencia local']
              ], segs: null };
            }
            if (type === 'height') {
              const a = pts[0], b = pts[pts.length - 1];
              const dz = Math.abs(b.z - a.z), horiz = d2(a, b);
              const pend = horiz > 0 ? (dz / horiz) * 100 : 0;
              const grad = Math.atan2(dz, horiz) * 180 / Math.PI;
              return { type: 'Altura', val: nf(dz, 2), unit: 'm  Δ vertical', rows: [
                ['Pendiente',  '<b>' + nf(pend, 1) + '</b> %'],
                ['Ángulo',     '<b>' + nf(grad, 1) + '</b>°'],
                ['Horizontal', nf(horiz, 2) + ' m']
              ], segs: null };
            }
            if (type === 'area') {
              const area = m.getArea(), ha = area / 10000;   // planimétrica (shoelace x,y)
              let perim = 0;
              for (let i = 1; i < pts.length; i++) perim += d2(pts[i - 1], pts[i]);
              if (pts.length > 2) perim += d2(pts[pts.length - 1], pts[0]);
              const segs = [];
              for (let i = 1; i < pts.length; i++) segs.push(['Lado ' + i, nf(d2(pts[i-1], pts[i]), 1) + ' m']);
              if (pts.length > 2) segs.push(['Lado ' + pts.length + ' (cierre)', nf(d2(pts[pts.length-1], pts[0]), 1) + ' m']);
              return { type: 'Área', val: nf(area, area >= 10000 ? 0 : 1), unit: 'm²', rows: [
                ['Hectáreas', '<b>' + nf(ha, 3) + '</b> ha'],
                ['Perímetro', nf(perim, 1) + ' m'],
                ['Vértices',  pts.length]
              ], segs: pts.length > 1 ? segs : null };
            }
            // distance
            const total = m.getTotalDistance();   // 3D
            let zMin = Infinity, zMax = -Infinity;
            pts.forEach(p => { zMin = Math.min(zMin, p.z); zMax = Math.max(zMax, p.z); });
            const desnivel = (pts.length > 1) ? (zMax - zMin) : 0;
            const segs = [];
            for (let i = 1; i < pts.length; i++) segs.push(['Tramo ' + i, nf(d3(pts[i-1], pts[i]), 2) + ' m']);
            return { type: 'Distancia', val: nf(total, 2), unit: 'm  (3D)', rows: [
              ['Tramos',   Math.max(0, pts.length - 1)],
              ['Desnivel', '<b>' + nf(desnivel, 2) + '</b> m']
            ], segs: pts.length > 1 ? segs : null };
          }

          function rowsHTML(pairs) {
            return pairs.map(([k, v]) =>
              `<div class="mi-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
          }
          function segsHTML(segs) {
            return segs.map(([k, v]) =>
              `<div class="seg"><span>${k}</span><span class="v">${v}</span></div>`).join('');
          }

          function cardTemplate() {
            const el = document.createElement('div');
            el.className = 'mi-card';
            el.innerHTML =
              '<div class="mi-head">' +
                '<div class="mi-type"><span class="dot"></span><span class="mi-type-label">Medición</span></div>' +
                '<button class="mi-close" aria-label="Cerrar medición" title="Cerrar">✕</button>' +
              '</div>' +
              '<div class="mi-primary"><span class="val">—</span><span class="unit"></span></div>' +
              '<div class="mi-rows"></div>' +
              '<div class="mi-segs" style="display:none"></div>';
            return el;
          }

          function paintCard(el, data) {
            el.querySelector('.mi-type-label').textContent = data.type;
            el.querySelector('.mi-primary .val').textContent = data.val;
            el.querySelector('.mi-primary .unit').textContent = data.unit;
            el.querySelector('.mi-rows').innerHTML = rowsHTML(data.rows);
            const seg = el.querySelector('.mi-segs');
            if (data.segs && data.segs.length) { seg.innerHTML = segsHTML(data.segs); seg.style.display = 'flex'; }
            else { seg.innerHTML = ''; seg.style.display = 'none'; }
          }

          function renderCard(m) {
            const entry = cards.get(m);
            if (!entry || !m.points || m.points.length === 0) return;
            const data = computeData(m);
            if (externalCards) {
              parent.postMessage({ source: 'potree-cards', action: 'render', id: entry.id, data }, '*');
            } else if (entry.el) {
              paintCard(entry.el, data);
            }
          }

          function openCard(m) {
            let entry = cards.get(m);
            if (!entry) {
              entry = { id: ++cardIdSeq };
              cards.set(m, entry);
              idToMeasure.set(entry.id, m);
              if (!externalCards) {
                const el = cardTemplate();
                el.querySelector('.mi-close').addEventListener('click', () => closeCard(m));
                stack.appendChild(el);            // se apila debajo (más nueva junto al ancla)
                entry.el = el;
                document.body.classList.add('measure-open');
              }
            }
            renderCard(m);
            if (entry.el) entry.el.scrollIntoView({ block: 'nearest' });
            return entry;
          }
          function closeCard(m) {
            const entry = cards.get(m);
            if (!entry) return;
            if (entry.el) entry.el.remove();
            if (externalCards) parent.postMessage({ source: 'potree-cards', action: 'close', id: entry.id }, '*');
            idToMeasure.delete(entry.id);
            cards.delete(m);
            if (cards.size === 0) document.body.classList.remove('measure-open');
          }
          function closeAllCards() {
            if (externalCards) parent.postMessage({ source: 'potree-cards', action: 'clear' }, '*');
            cards.forEach((e) => { if (e.el) e.el.remove(); });
            cards.clear();
            idToMeasure.clear();
            document.body.classList.remove('measure-open');
          }

          // Modo externo: el padre (deck) avisa cuando el usuario cierra una card con su ✕
          if (externalCards) {
            window.addEventListener('message', (e) => {
              const d = e.data;
              if (!d || d.source !== 'potree-cards-cmd') return;
              if (d.action === 'close') { const m = idToMeasure.get(d.id); if (m) closeCard(m); }
            });
          }

          // ⚠ NO usar viewer.inputHandler.toggleSelection() con mediciones: el
          // TransformationTool lee selection[0].boundingBox.getCenter() cada frame
          // y los spheres de Measure NO tienen boundingBox → crash + overlay de error.
          // Usamos el evento 'click' del sphere (lo dispara onMouseUp sin tocar la
          // selección) para abrir/refrescar su card. Las cards persisten hasta ✕/Limpiar.
          function attachClick(sphere, m) {
            if (!sphere || sphere.__clkAttached) return;
            sphere.__clkAttached = true;
            sphere.userData.__measure = m;
            sphere.addEventListener('click', () => openCard(m));   // 'click' = onMouseUp · sin selección
          }

          // Wirea una medición: clickeable (re-ver) + refresco en vivo de su card.
          function wireMeasure(m) {
            if (m.__wired) return;
            m.__wired = true;
            m.spheres.forEach((s) => attachClick(s, m));
            m.addEventListener('marker_added', (e) => attachClick(e.sphere, m));
            const refresh = () => { if (cards.has(m)) renderCard(m); };
            ['marker_added','marker_dropped','marker_moved','marker_removed']
              .forEach((ev) => m.addEventListener(ev, refresh));
          }

          // Wirea mediciones existentes y futuras (las de la toolbar pasan por aquí
          // vía 'measurement_added'). Al remover una medición, cierra su card.
          viewer.scene.measurements.forEach(wireMeasure);
          viewer.scene.addEventListener('measurement_added',   (e) => { if (e.measurement) wireMeasure(e.measurement); });
          viewer.scene.addEventListener('measurement_removed', (e) => { if (e.measurement) closeCard(e.measurement); });

          // Activación de herramienta (reusable: botones in-iframe + comandos externos del deck)
          function clearMeasurements() {
            viewer.scene.measurements.slice().forEach(m => viewer.scene.removeMeasurement(m));
            try { viewer.scene.profiles.slice().forEach(p => viewer.scene.removeProfile(p)); } catch (e) {}
            try { viewer.scene.volumes.slice().forEach(v => viewer.scene.removeVolume(v)); } catch (e) {}
            toolBtns.forEach(b => b.classList.remove('active'));
            closeAllCards();
            if (typeof clearExtraCards === 'function') clearExtraCards();
            measuringActive = false;   // reanuda la navegación táctil
            if (externalControls) parent.postMessage({ source:'potree-state', action:'tool', value:null }, '*');
          }
          function activateTool(tool) {
            if (tool === 'clear') { clearMeasurements(); return; }
            if (sampleMode && tool === 'point') return;
            toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
            measuringActive = true;    // mientras se mide/dibuja, el gesto coloca puntos (no navega)
            if (tool === 'profile') { startProfileTool(); return; }
            if (tool === 'volume')  { startVolumeTool();  return; }
            const m = measuringTool.startInsertion(presets[tool]);
            wireMeasure(m);
            openCard(m);   // feedback en vivo: la card aparece y se actualiza al colocar puntos
          }
          toolBtns.forEach(btn => btn.addEventListener('click', () => activateTool(btn.dataset.tool)));

          // ── Leyenda de elevación (solo visible en modo 'elevation') ─────
          const legend  = document.getElementById('elevation-legend');
          const teNodes = [0,1,2,3,4].map(i => document.getElementById('ele-t' + i));
          function updateElevationLegend(attr) {
            // Marca en el body para que el CSS móvil eleve las cards sobre la leyenda
            document.body.classList.toggle('elevation-on', attr === 'elevation');
            const isElev = attr === 'elevation';
            let ticks = null;
            if (isElev) {
              // Lee elevationRange real del material (Potree lo inicializa desde bbox.z)
              let lo = null, hi = null;
              try {
                const r = material.elevationRange;
                if (Array.isArray(r) && r.length === 2) { lo = r[0]; hi = r[1]; }
              } catch (e) { /* noop */ }
              if (lo == null || hi == null) {
                lo = 0;
                hi = 45;
              }

              const t = (frac) => Math.round(lo + (hi - lo) * frac);
              ticks = [t(0), t(0.25), t(0.5), t(0.75), t(1)];
              // Bordes con sufijo 'm'; intermedios solo número (el header ya dice 'm s.n.m.')
              teNodes[0].textContent = ticks[0] + ' m';
              teNodes[1].textContent = ticks[1];
              teNodes[2].innerHTML   = '<b>' + ticks[2] + '</b>';
              teNodes[3].textContent = ticks[3];
              teNodes[4].textContent = ticks[4] + ' m';
              legend.classList.add('visible');
              legend.setAttribute('aria-hidden', 'false');
            } else {
              legend.classList.remove('visible');
              legend.setAttribute('aria-hidden', 'true');
            }
            // En modo externo, el padre (deck) pinta la leyenda arriba del iframe
            if (externalControls) parent.postMessage({ source:'potree-state', action:'legend', visible:isElev, ticks }, '*');
          }

          // ── Leyenda de clasificación (solo visible en modo 'classification') ──
          const classLegend = document.getElementById('class-legend');
          function updateClassLegend(attr) {
            if (!classLegend) return;
            const on = attr === 'classification';
            classLegend.classList.toggle('visible', on);
            classLegend.setAttribute('aria-hidden', on ? 'false' : 'true');
          }

          // ── Color (RGB ↔ Clasif ↔ Elevación) · reusable in-iframe + externo ──
          const colorBtns = document.querySelectorAll('#color-toggle button[data-color]');
          function applyColor(value) {
            colorBtns.forEach(b => b.classList.toggle('active', b.dataset.color === value));
            material.activeAttributeName = value;
            updateElevationLegend(value);
            updateClassLegend(value);
            // Curvas de nivel auto-ON en vistas técnicas (Clasificación / Elevación), OFF en RGB.
            // setContours es function-declaration (hoisted); applyColor solo se llama por
            // interacción del usuario (post-init) → la maquinaria de curvas ya existe.
            if (typeof setContours === 'function') setContours(value === 'classification' || value === 'elevation');
          }
          colorBtns.forEach(btn => btn.addEventListener('click', () => applyColor(btn.dataset.color)));
          // Estado inicial (RGB por default · leyenda oculta)
          updateElevationLegend(material.activeAttributeName);

          // ── Wire density slider (point budget) ──────────────────────────
          const dSlider = document.getElementById('density-slider');
          const dValue  = document.getElementById('density-value');
          function fmtBudget(v) {
            return v >= 1000000
              ? (v / 1000000).toFixed(v % 1000000 === 0 ? 0 : 1) + ' M'
              : (v / 1000).toFixed(0) + ' K';
          }
          function applyDensity(v) {
            v = parseInt(v, 10);
            if (!v) return;
            viewer.setPointBudget(v);
            if (dValue)  dValue.textContent = fmtBudget(v);
            if (dSlider) dSlider.value = v;
          }
          dSlider.addEventListener('input', () => applyDensity(dSlider.value));
          // Sync inicial: el slider ya marca 4M = lo que ya setteamos arriba
          dValue.textContent = fmtBudget(parseInt(dSlider.value, 10));

          // ════════════════════════════════════════════════════════════════
          //  Panel "Capas" + F1 filtro clasificación + F2 curvas + F3 perfil + F4 volumen
          // ════════════════════════════════════════════════════════════════
          const layersBtn = document.getElementById('layers-btn');
          const layersPanel = document.getElementById('layers-panel');
          if (layersBtn && layersPanel) {
            layersBtn.addEventListener('click', () => {
              const willOpen = layersPanel.hasAttribute('hidden');
              if (willOpen) layersPanel.removeAttribute('hidden'); else layersPanel.setAttribute('hidden', '');
              layersBtn.classList.toggle('open', willOpen);
            });
          }

          // ── F1 · Filtro de clasificación (ver terreno limpio) ──────────
          // Terreno = 2 ground + 9 agua (nunca se ocultan). Grupos togglables:
          const CLASS_GROUPS = { veg: [3,4,5], const: [6], obj: [0,1,8,12] };
          function setGroupVisible(grp, vis) {
            (CLASS_GROUPS[grp] || []).forEach(c => viewer.setClassificationVisibility(c, vis));
          }
          const grpChips = Array.from(document.querySelectorAll('#layers .lp-chip[data-grp]'));
          function setChip(chip, on) { chip.classList.toggle('on', on); setGroupVisible(chip.dataset.grp, on); }
          // Al ocultar algo en modo RGB, pasar a Elevación para que el suelo se lea.
          function colorForCleanIfNeeded() {
            const anyHidden = grpChips.some(c => !c.classList.contains('on'));
            if (anyHidden && material.activeAttributeName === 'rgba') applyColor('elevation');
          }
          grpChips.forEach(chip => chip.addEventListener('click', () => { setChip(chip, !chip.classList.contains('on')); colorForCleanIfNeeded(); }));
          document.querySelectorAll('#layers .lp-act').forEach(btn => btn.addEventListener('click', () => {
            const showAll = btn.dataset.act === 'all';
            grpChips.forEach(chip => setChip(chip, showAll));
            if (!showAll && material.activeAttributeName === 'rgba') applyColor('elevation');
          }));

          // ── F2 · Curvas de nivel (overlay vectorial) + F5 etiquetas ────
          let contourGroup = null, contourLabels = [], contoursReady = false, contoursLoading = false;
          const contoursChip = document.querySelector('#layers .lp-chip[data-layer="contours"]');
          function harvestTHREE() {
            const Vector3 = viewer.scene.view.position.constructor;
            let LineCls, GeomCls, MatCls;
            try {
              const probe = new Potree.BoxVolume();
              probe.traverse(o => {
                if (o.geometry && o.material && /Line/.test(o.type || '')) {
                  LineCls = o.constructor; GeomCls = o.geometry.constructor; MatCls = o.material.constructor;
                }
              });
            } catch (e) { console.warn('harvest THREE falló', e); }
            return (LineCls && GeomCls && MatCls) ? { Vector3, LineCls, GeomCls, MatCls } : null;
          }
          function buildContours(data, T) {
            const verts = [];
            data.forEach(poly => { for (let i = 1; i < poly.length; i++) {
              const a = poly[i-1], b = poly[i];
              verts.push(new T.Vector3(a[0], a[1], a[2]));
              verts.push(new T.Vector3(b[0], b[1], b[2]));
            }});
            const geom = new T.GeomCls();
            geom.setFromPoints(verts);
            const mat = new T.MatCls({ color: 0xC8F08A, transparent: true, opacity: 0.9, depthWrite: false });
            const seg = new T.LineCls(geom, mat);
            seg.name = 'contours-overlay';
            return seg;
          }
          // F5 · Etiquetas de elevación en las curvas índice (cada 5 m) · TextSprite
          function buildContourLabels(data) {
            const labels = [], perLevel = {};
            data.forEach(poly => {
              if (poly.length < 5) return;
              const mid = poly[Math.floor(poly.length / 2)];
              const zr = Math.round(mid[2]);
              if (zr % 5 !== 0) return;                       // solo curvas índice
              if ((perLevel[zr] || 0) >= 2) return;           // máx 2 etiquetas por nivel
              perLevel[zr] = (perLevel[zr] || 0) + 1;
              let spr;
              try { spr = new Potree.TextSprite(zr + ' m'); } catch (e) { return; }
              try { if (spr.setTextColor)       spr.setTextColor({ r: 215, g: 240, b: 155, a: 1 }); } catch (e) {}
              try { if (spr.setBackgroundColor) spr.setBackgroundColor({ r: 18, g: 24, b: 12, a: 0.6 }); } catch (e) {}
              try { if (spr.setBorderColor)     spr.setBorderColor({ r: 123, g: 193, b: 66, a: 0.7 }); } catch (e) {}
              spr.position.set(mid[0], mid[1], mid[2] + 1.0);
              if (spr.scale && spr.scale.set) spr.scale.set(6, 6, 6);
              spr.name = 'contour-label';
              labels.push(spr);
            });
            return labels;
          }
          async function ensureContours() {
            if (contoursReady || contoursLoading) return;
            contoursLoading = true;
            try {
              const contourUrl = '/assets/_potree/clouds/agua-blanca-veg/contours-sample.json';
              const data = await fetch(contourUrl).then(r => r.json());
              const T = harvestTHREE();
              if (!T) { contoursChip.textContent = 'Curvas (no disp.)'; return; }
              contourGroup = buildContours(data, T);
              contourGroup.visible = false;
              viewer.scene.scene.add(contourGroup);
              contourLabels = buildContourLabels(data);
              contourLabels.forEach(s => { s.visible = false; viewer.scene.scene.add(s); });
              contoursReady = true;
            } catch (e) { console.warn('curvas error', e); }
            finally { contoursLoading = false; }
          }
          async function setContours(show) {
            await ensureContours();
            if (!contourGroup) return;
            if (contoursChip) contoursChip.classList.toggle('active', show);
            contourGroup.visible = show;
            contourLabels.forEach(s => { s.visible = show; });
          }
          if (contoursChip) contoursChip.addEventListener('click', () => {
            setContours(!contoursChip.classList.contains('active'));
          });
          // Curvas de nivel encendidas desde el inicio (decisión Diego 2026-06-03)
          (async () => {
            await ensureContours();
            setContours(true);
            if (contoursChip) contoursChip.classList.add('active');
          })();
          // Etiquetas con tamaño ~constante en pantalla (TextSprite no se auto-escala
          // si no está en el árbol de anotaciones de Potree → escalar por distancia).
          viewer.addEventListener('update', () => {
            if (!contourLabels.length) return;
            const cam = viewer.scene.getActiveCamera();
            for (const s of contourLabels) {
              if (!s.visible) continue;
              const d = cam.position.distanceTo(s.position);
              const k = Math.max(1.5, d * 0.045);
              s.scale.set(k, k, k);
            }
          });

          // ── Cards extra (volumen/perfil) · reusan cardTemplate/stack ────
          const extraCards = new Set();
          function addExtraCard() {
            const el = cardTemplate(); stack.appendChild(el);
            document.body.classList.add('measure-open'); extraCards.add(el); return el;
          }
          function removeExtraCard(el) {
            if (el) { el.remove(); extraCards.delete(el); }
            if (cards.size === 0 && extraCards.size === 0) document.body.classList.remove('measure-open');
          }
          function clearExtraCards() { extraCards.forEach(el => el.remove()); extraCards.clear(); }

          // ── F4 · Volumen / cubicación ──────────────────────────────────
          function startVolumeTool() {
            let vol;
            try { vol = viewer.volumeTool.startInsertion({ clip: false }); }
            catch (e) { console.warn('volumeTool falló', e); return; }
            const el = addExtraCard();
            el.querySelector('.mi-close').addEventListener('click', () => { try { viewer.scene.removeVolume(vol); } catch (e) {} removeExtraCard(el); });
            let last = '';
            const paint = () => {
              if (!vol) return;
              const sx = vol.scale.x, sy = vol.scale.y, sz = vol.scale.z;
              const key = sx.toFixed(2)+sy.toFixed(2)+sz.toFixed(2);
              if (key === last) return; last = key;
              let m3 = 0; try { m3 = vol.getVolume(); } catch (e) { m3 = sx*sy*sz; }
              paintCard(el, { type: 'Volumen', val: nf(m3, m3 >= 100 ? 0 : 1), unit: 'm³', rows: [
                ['Largo', nf(sx, 1) + ' m'], ['Ancho', nf(sy, 1) + ' m'], ['Alto', nf(sz, 1) + ' m']
              ], segs: null });
            };
            paint();
            const onUpd = () => paint();
            viewer.addEventListener('update', onUpd);
            viewer.scene.addEventListener('volume_removed', function h(e) { if (e.volume === vol) { viewer.removeEventListener('update', onUpd); viewer.scene.removeEventListener('volume_removed', h); } });
          }

          // ── F3 · Perfil topográfico ────────────────────────────────────
          function renderProfileChart(el, pts) {
            const P = (pts || []).map(p => ({ x: p.x, y: p.y, z: p.z }));
            if (P.length < 2) {
              paintCard(el, { type: 'Perfil del terreno', val: '—', unit: 'traza la línea sobre el terreno', rows: [['Vértices', P.length]], segs: null });
              return;
            }
            const dcum = [0]; let total = 0;
            for (let i = 1; i < P.length; i++) { total += Math.hypot(P[i].x - P[i-1].x, P[i].y - P[i-1].y); dcum.push(total); }
            let zmin = Infinity, zmax = -Infinity; P.forEach(p => { zmin = Math.min(zmin, p.z); zmax = Math.max(zmax, p.z); });
            const dz = zmax - zmin;
            const W = 230, H = 86, padL = 3, padR = 3, padT = 7, padB = 12;
            const sx = d => padL + (total > 0 ? d / total : 0) * (W - padL - padR);
            const sy = z => padT + (dz > 0 ? (zmax - z) / dz : 0.5) * (H - padT - padB);
            let line = '', area = 'M' + sx(0).toFixed(1) + ',' + (H - padB);
            P.forEach((p, i) => { const X = sx(dcum[i]).toFixed(1), Y = sy(p.z).toFixed(1); line += (i ? 'L' : 'M') + X + ',' + Y + ' '; area += 'L' + X + ',' + Y + ' '; });
            area += 'L' + sx(total).toFixed(1) + ',' + (H - padB) + ' Z';
            const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="none" style="display:block;margin-top:2px">' +
              '<path d="' + area + '" fill="rgba(123,193,66,0.16)"/>' +
              '<path d="' + line + '" fill="none" stroke="#A5D570" stroke-width="1.6"/></svg>';
            const slope = total > 0 ? (Math.abs(P[P.length-1].z - P[0].z) / total * 100) : 0;
            el.querySelector('.mi-type-label').textContent = 'Perfil del terreno';
            el.querySelector('.mi-primary .val').textContent = nf(total, 1);
            el.querySelector('.mi-primary .unit').textContent = 'm  (longitud)';
            el.querySelector('.mi-rows').innerHTML =
              '<div class="mi-row"><span class="k">Desnivel</span><span class="v"><b>' + nf(dz, 2) + '</b> m</span></div>' +
              '<div class="mi-row"><span class="k">Elev. máx · mín</span><span class="v">' + nf(zmax, 1) + ' · ' + nf(zmin, 1) + ' m</span></div>' +
              '<div class="mi-row"><span class="k">Pendiente media</span><span class="v">' + nf(slope, 1) + ' %</span></div>';
            const seg = el.querySelector('.mi-segs'); seg.style.display = 'block'; seg.innerHTML = svg;
          }
          function startProfileTool() {
            let profile;
            try { profile = viewer.profileTool.startInsertion({ width: 0 }); }
            catch (e) { console.warn('profileTool falló', e); return; }
            try { profile.setWidth(4); } catch (e) {}
            const el = addExtraCard();
            el.querySelector('.mi-close').addEventListener('click', () => { try { viewer.scene.removeProfile(profile); } catch (e) {} removeExtraCard(el); });
            const refresh = () => renderProfileChart(el, profile.points || []);
            ['marker_added','marker_moved','marker_dropped','marker_removed'].forEach(ev => { try { profile.addEventListener(ev, refresh); } catch (e) {} });
            refresh();
          }

          // ── Comandos del padre (modo ?controls=external · controles arriba del iframe) ──
          if (externalControls) {
            window.addEventListener('message', (e) => {
              const d = e.data;
              if (!d || d.source !== 'potree-ctrl') return;
              if      (d.action === 'color')    applyColor(d.value);
              else if (d.action === 'density')  applyDensity(d.value);
              else if (d.action === 'tool')     activateTool(d.value);
              else if (d.action === 'clear')    clearMeasurements();
              else if (d.action === 'stoptool') { measuringActive = false; toolBtns.forEach(b => b.classList.remove('active')); }  // reanuda nav sin borrar
            });
          }

          console.log('Potree cloud loaded · earthControls' + (isTouch ? ' + map-touch' : '') + (externalControls ? ' + external-controls' : ''));
        }
      );

      // No cargar sidebar de Potree (UI propia)
      viewer.loadGUI = function () {};

      // ══ Controlador táctil estilo mapa (móvil) ════════════════════════════
      // earthControls queda como base inactiva (no-op en reposo · su drag aborta
      // sin pivot). Aquí manejamos el gesto directo sobre viewer.scene.view:
      //   · 1 dedo  → desplazar sobre el terreno (view.pan, escalado por radius)
      //   · 2 dedos → pellizcar = zoom · girar = yaw · arrastrar vertical = tilt
      //               todo alrededor del punto que mira la cámara (getPivot).
      // Permite acercarse MUCHO más (radius mín 0.8 m). Vectores construidos con
      // los métodos de las instancias Vector3 (THREE no es global): clone/set/etc.
      function setupMapTouchNav(viewer, isMeasuring) {
        const el = viewer.renderer.domElement;
        const MIN_R = 0.1, MAX_R = 6000;   // piso de zoom muy bajo · el near capado por radius evita el recorte
        let mode = 0, p = null;
        const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
        const mid  = (t) => ({ x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 });
        const ang  = (t) => Math.atan2(t[1].clientY - t[0].clientY, t[1].clientX - t[0].clientX);

        function start(e) {
          if (isMeasuring()) return;       // dejar que el tap coloque puntos de medición
          const t = e.touches;
          if (t.length === 1) { mode = 1; p = { x:t[0].clientX, y:t[0].clientY }; e.preventDefault(); }
          else if (t.length >= 2) { mode = 2; p = { d:dist(t), m:mid(t), a:ang(t) }; e.preventDefault(); }
        }
        function move(e) {
          if (isMeasuring() || !mode) return;
          const t = e.touches, v = viewer.scene.view;
          const W = el.clientWidth || 1, H = el.clientHeight || 1;
          if (mode === 1 && t.length === 1) {
            const dx = t[0].clientX - p.x, dy = t[0].clientY - p.y;
            p = { x:t[0].clientX, y:t[0].clientY };
            const g = v.radius * 1.6;       // pan ∝ distancia · velocidad de la nav "buena" (1.0 se sintió lento/limitado)
            v.pan(-(dx / W) * g, (dy / H) * g);   // el terreno sigue al dedo
            e.preventDefault();
          } else if (mode === 2 && t.length >= 2) {
            const d = dist(t), m = mid(t), a = ang(t);
            const pivot = v.getPivot();                 // punto que mira la cámara
            const toCam = v.position.clone().sub(pivot);
            const Z = v.position.clone().set(0, 0, 1);   // eje vertical mundo
            // zoom: escala distancia cámara↔pivote
            let len = toCam.length();
            if (p.d > 0 && d > 0) len = Math.max(MIN_R, Math.min(MAX_R, len * (p.d / d)));
            // girar (yaw): twist de los 2 dedos alrededor del eje vertical
            toCam.applyAxisAngle(Z, (a - p.a));   // signo: girar 2 dedos → la nube gira en el MISMO sentido
            // tilt (pitch): arrastre vertical del punto medio · sin voltear bajo el horizonte
            const side = toCam.clone().cross(Z);
            if (side.length() > 1e-6) {
              side.normalize();
              const dPitch = ((m.y - p.m.y) / H) * 2.2;   // tilt · velocidad de la nav "buena"
              const test = toCam.clone().applyAxisAngle(side, dPitch);
              if (test.z > 0.05 * test.length()) toCam.applyAxisAngle(side, dPitch);
            }
            toCam.normalize().multiplyScalar(len);
            v.position.copy(pivot.clone().add(toCam));
            v.lookAt(pivot.x, pivot.y, pivot.z);          // recomputa yaw/pitch/radius coherentes
            p = { d:d, m:m, a:a };
            e.preventDefault();
          }
        }
        function end(e) {
          const t = e.touches;
          if (t.length === 0) mode = 0;
          else if (t.length === 1) { mode = 1; p = { x:t[0].clientX, y:t[0].clientY }; }
          else { mode = 2; p = { d:dist(t), m:mid(t), a:ang(t) }; }
        }
        el.addEventListener('touchstart',  start, { passive:false });
        el.addEventListener('touchmove',   move,  { passive:false });
        el.addEventListener('touchend',    end,   { passive:false });
        el.addEventListener('touchcancel', end,   { passive:false });
      }

    });
  </script>
</body>
</html>
